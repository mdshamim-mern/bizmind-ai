<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BizMind AI" />
  <title>BizMind AI</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
    .nav-btn.active {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }
    html.dark body { background-color: #0b1120; color: #e2e8f0; }
    html.dark header { background-color: #0f172a; border-color: #1e293b; }
    html.dark .surface-card { background-color: #111827 !important; border-color: #1f2937 !important; color: #f1f5f9 !important; }
    html.dark .surface-sub { background-color: #1e293b !important; border-color: #334155 !important; color: #e2e8f0 !important; }
    html.dark .text-slate-900 { color: #f8fafc !important; }
    html.dark .text-slate-800 { color: #e2e8f0 !important; }
    html.dark .text-slate-700 { color: #cbd5e1 !important; }
    html.dark .text-slate-600 { color: #94a3b8 !important; }
    html.dark .text-slate-500 { color: #94a3b8 !important; }
    html.dark .bg-slate-50 { background-color: #1e293b !important; }
    html.dark .bg-slate-100 { background-color: #1e293b !important; }
    html.dark .bg-white { background-color: #111827 !important; }
    html.dark .border-slate-200 { border-color: #334155 !important; }
    html.dark .border-slate-300 { border-color: #475569 !important; }
    html.dark input, html.dark select, html.dark textarea {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }
    html.dark tr:hover { background-color: #1e293b !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm">
          BM
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <h1 class="font-bold text-lg text-slate-900" data-i18n="appName">বিজমাইন্ড এআই</h1>
            <span id="brandTagBadge" data-i18n="brandTag" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
              মুদি দোকানের এআই পার্টনার
            </span>
          </div>
          <p class="text-xs text-slate-500" id="activeShopSubtitle" data-i18n="subtitle">
            অপচয় কমায় · বাকি আদায় করে · লাভ বাড়ায়
          </p>
        </div>
      </div>

      <!-- Navbar Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" id="langToggleBtn" class="px-2.5 py-1.5 rounded-lg border border-indigo-300 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 text-xs font-bold transition">
          🌐 English
        </button>
        <button type="button" id="themeToggleBtn" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-100 text-slate-800 hover:bg-slate-200 text-xs font-bold transition">
          🌙 ডার্ক মোড
        </button>
        <select id="shopSelector" class="text-xs font-medium bg-slate-100 border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-800"></select>
        <select id="festivalSelector" class="text-xs font-semibold bg-amber-50 border border-amber-300 rounded-lg px-2.5 py-1.5 text-amber-900"></select>
        <button type="button" id="resetDemoBtn" data-i18n="resetDemo" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm">
          ডেমো চালাও (৯০ দিন)
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="bg-slate-900 text-slate-300 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-4 py-2 flex items-center gap-1.5 overflow-x-auto" id="navTabsContainer">
        <button type="button" data-tab="dashboard" id="navTab_dashboard" data-i18n="tab_dashboard" class="nav-btn active whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold transition"></button>
        <button type="button" data-tab="assistant" id="navTab_assistant" data-i18n="tab_assistant" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="waste" id="navTab_waste" data-i18n="tab_waste" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="baki" id="navTab_baki" data-i18n="tab_baki" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="chalan" id="navTab_chalan" data-i18n="tab_chalan" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="forecast" id="navTab_forecast" data-i18n="tab_forecast" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="restock" id="navTab_restock" data-i18n="tab_restock" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="pos" id="navTab_pos" data-i18n="tab_pos" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="simulator" id="navTab_simulator" data-i18n="tab_simulator" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
      </div>
    </div>
  </header>

  <!-- Toast Banner -->
  <div id="toastBanner" class="hidden fixed bottom-5 right-5 z-50 max-w-md bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700 flex items-center justify-between gap-3">
    <span id="toastMessage" class="text-xs font-medium"></span>
    <button type="button" id="closeToastBtn" class="text-slate-400 hover:text-white text-xs font-bold">✕</button>
  </div>

  <!-- Explainable AI Modal -->
  <div id="whyModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="surface-card bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-200 pb-2">
        <h3 class="font-bold text-sm text-indigo-700" id="whyModalTitle"></h3>
        <button type="button" id="closeWhyModalBtn" class="text-slate-400 hover:text-slate-700 font-bold text-sm">✕</button>
      </div>
      <div id="whyModalBody" class="text-xs text-slate-700 space-y-2 leading-relaxed"></div>
    </div>
  </div>

  <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-1 space-y-6">
    <!-- TAB 1: COMMAND CENTER -->
    <section id="tab-dashboard" class="tab-panel space-y-6">
      <div class="bg-gradient-to-r from-emerald-900 via-teal-900 to-indigo-950 text-white rounded-2xl p-5 shadow-md space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300" id="impactSubBadge" data-i18n="impactSub"></span>
            <h2 class="text-lg md:text-xl font-extrabold mt-0.5" id="impactHeadlineText"></h2>
          </div>
          <button type="button" id="storyDemoBtn" data-i18n="storyBtn" class="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs shadow transition"></button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-white/10 border border-white/15 rounded-xl p-3.5">
            <p class="text-xs text-emerald-200" id="lblImpactWaste" data-i18n="lblImpactWaste"></p>
            <p class="text-2xl font-extrabold mt-0.5" id="impactWasteSaved"></p>
          </div>
          <div class="bg-white/10 border border-white/15 rounded-xl p-3.5">
            <p class="text-xs text-sky-200" id="lblImpactStockout" data-i18n="lblImpactStockout"></p>
            <p class="text-2xl font-extrabold mt-0.5" id="impactStockouts"></p>
          </div>
          <div class="bg-white/10 border border-white/15 rounded-xl p-3.5">
            <p class="text-xs text-amber-200" id="lblImpactBaki" data-i18n="lblImpactBaki"></p>
            <p class="text-2xl font-extrabold mt-0.5" id="impactBaki"></p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 surface-card bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600" data-i18n="morningSub"></span>
              <h3 class="text-base font-bold text-slate-900" id="lblMorningTitle" data-i18n="lblMorningTitle"></h3>
            </div>
            <button type="button" id="whyMorningBriefBtn" data-i18n="whyBtn" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100"></button>
          </div>
          <div id="morningBriefList" class="space-y-2.5"></div>
        </div>

        <div class="surface-card bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-600" data-i18n="healthSub"></span>
              <h3 class="text-base font-bold text-slate-900" id="lblHealthTitle" data-i18n="lblHealthTitle"></h3>
            </div>
            <div class="text-right">
              <span class="text-3xl font-extrabold text-indigo-600" id="healthScoreValue"></span>
              <span class="text-xs font-bold text-slate-400" data-i18n="outOf100"></span>
            </div>
          </div>
          <div id="healthBreakdownList" class="space-y-2 text-xs"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="surface-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" id="lblKpiRev" data-i18n="lblKpiRev"></p>
          <p class="text-2xl font-extrabold text-slate-900 mt-1" id="kpiRevenue"></p>
        </div>
        <div class="surface-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" id="lblKpiGross" data-i18n="lblKpiGross"></p>
          <p class="text-2xl font-extrabold text-indigo-600 mt-1" id="kpiGrossProfit"></p>
        </div>
        <div class="surface-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" id="lblKpiLoss" data-i18n="lblKpiLoss"></p>
          <p class="text-2xl font-extrabold text-rose-600 mt-1" id="kpiInvLoss"></p>
        </div>
        <div class="surface-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" id="lblKpiNet" data-i18n="lblKpiNet"></p>
          <p class="text-2xl font-extrabold text-emerald-600 mt-1" id="kpiNetProfit"></p>
        </div>
      </div>

      <div class="surface-card bg-rose-50 border border-rose-200 rounded-xl p-4 space-y-2" id="marginLeakBox">
        <div class="flex items-center justify-between">
          <h4 class="text-xs font-bold text-rose-700 uppercase tracking-wider" data-i18n="marginLeakHeading"></h4>
          <span class="text-xs font-semibold text-rose-600" id="lblMarginBadge" data-i18n="lblMarginBadge"></span>
        </div>
        <div id="marginLeakAlerts" class="space-y-1.5 text-xs"></div>
      </div>
    </section>

    <!-- TAB 2: VOICE ASSISTANT & AI CHAT -->
    <section id="tab-assistant" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="text-base font-bold text-slate-900" id="lblVoiceTitle" data-i18n="voiceTitle"></h3>
              <p class="text-xs text-slate-500" id="lblVoiceSub" data-i18n="voiceSub"></p>
            </div>
            <button type="button" id="voiceSpeakBtn" data-i18n="voiceBtn" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition"></button>
          </div>

          <div class="flex flex-wrap gap-2" id="quickAskContainer"></div>

          <form id="aiChatForm" class="flex gap-2">
            <input type="text" id="aiChatInput" class="flex-1 text-xs border border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button type="submit" id="btnAskSubmit" data-i18n="askSubmitBtn" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs"></button>
          </form>

          <div id="aiChatResponseBox" class="p-4 rounded-xl bg-slate-900 text-slate-100 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
              <span class="text-xs font-bold text-emerald-400" data-i18n="toolCallingBadge"></span>
              <button type="button" id="readAloudAnswerBtn" data-i18n="readAloudBtn" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-indigo-300 font-semibold"></button>
            </div>
            <p id="aiChatAnswerText" class="text-xs leading-relaxed whitespace-pre-line"></p>
          </div>
        </div>

        <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h4 class="text-sm font-bold text-slate-900" id="chatChartTitle"></h4>
          <div class="relative h-72">
            <canvas id="assistantChart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 3: WASTE RESCUE -->
    <section id="tab-waste" class="tab-panel hidden space-y-6">
      <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <span class="text-xs font-bold text-amber-600 uppercase" data-i18n="wasteStarTag"></span>
            <h3 class="text-base font-bold text-slate-900" id="lblWasteTitle" data-i18n="wasteTitle"></h3>
            <p class="text-xs text-slate-500" id="lblWasteSub" data-i18n="wasteSub"></p>
          </div>
          <span class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 font-bold text-xs" id="wasteTotalRecoverableBadge"></span>
        </div>
        <div id="wasteRescueGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- TAB 4: BAKI KHATA -->
    <section id="tab-baki" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <h3 class="text-base font-bold text-slate-900" id="lblBakiAddTitle" data-i18n="bakiAddTitle"></h3>
          <form id="addBakiForm" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblCustName"></label>
              <input type="text" id="bakiName" required class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblCustPhone"></label>
              <input type="text" id="bakiPhone" required value="01715-000000" class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblDueAmount"></label>
              <input type="number" id="bakiAmount" required value="1250" min="1" class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblNotes"></label>
              <input type="text" id="bakiNotes" class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2" />
            </div>
            <button type="submit" data-i18n="btnAddBaki" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-lg"></button>
          </form>
        </div>

        <div class="lg:col-span-2 surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-slate-900" id="lblBakiListTitle" data-i18n="bakiListTitle"></h3>
            <span class="text-xs font-bold px-3 py-1 rounded-full bg-rose-100 text-rose-800" id="totalBakiBadge"></span>
          </div>
          <div id="bakiCardsList" class="space-y-3"></div>
        </div>
      </div>
    </section>

    <!-- TAB 5: CHALAN SCANNER -->
    <section id="tab-chalan" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <span class="text-xs font-bold text-indigo-600 uppercase" data-i18n="chalanStarTag"></span>
          <h3 class="text-base font-bold text-slate-900" id="lblChalanTitle" data-i18n="chalanTitle"></h3>
          <p class="text-xs text-slate-500" data-i18n="chalanSub"></p>
          <div class="space-y-3">
            <input type="file" id="chalanFileInput" accept="image/*" class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700" />
            <textarea id="chalanTextInput" rows="4" class="w-full text-xs border border-slate-300 rounded-xl p-3"></textarea>
            <button type="button" id="scanChalanBtn" data-i18n="btnScanChalan" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl"></button>
          </div>
        </div>

        <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <div class="flex items-center justify-between gap-2">
            <h4 class="text-sm font-bold text-slate-900" data-i18n="chalanExtractedTitle"></h4>
            <button type="button" id="commitChalanStockBtn" data-i18n="btnCommitChalan" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs"></button>
          </div>
          <div id="chalanExtractedList" class="space-y-2 text-xs"></div>
        </div>
      </div>
    </section>

    <!-- TAB 6: FESTIVAL FORECAST -->
    <section id="tab-forecast" class="tab-panel hidden space-y-6">
      <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 class="text-base font-bold text-slate-900" id="lblForecastTitle" data-i18n="forecastTitle"></h3>
            <p class="text-xs text-slate-500" data-i18n="forecastSub"></p>
          </div>
          <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-900 font-bold text-xs" id="activeFestivalBadge"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                <th class="py-2.5 px-3 font-bold" data-i18n="colProduct"></th>
                <th class="py-2.5 px-3 font-bold text-right" data-i18n="colStock"></th>
                <th class="py-2.5 px-3 font-bold text-right" data-i18n="col7d"></th>
                <th class="py-2.5 px-3 font-bold text-right" data-i18n="col15d"></th>
                <th class="py-2.5 px-3 font-bold text-right" data-i18n="col30d"></th>
                <th class="py-2.5 px-3 font-bold" data-i18n="colConf"></th>
                <th class="py-2.5 px-3 font-bold" data-i18n="colFestWhy"></th>
              </tr>
            </thead>
            <tbody id="forecastTableBody" class="divide-y divide-slate-200"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 7: SMART REORDER -->
    <section id="tab-restock" class="tab-panel hidden space-y-6">
      <div class="surface-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div>

    function getFestivalBoost(prodEn) {
      const lower = prodEn.toLowerCase();
      if (currentFestival === 'RAMADAN_EID' && (lower.includes('oil') || lower.includes('rice') || lower.includes('egg') || lower.includes('milk'))) return 1.4;
      if (currentFestival === 'POHELA_BOISHAKH' && (lower.includes('rice') || lower.includes('oil') || lower.includes('milk'))) return 1.25;
      if (currentFestival === 'MONSOON_RAIN' && (lower.includes('rice') || lower.includes('egg'))) return 1.2;
      return 1.0;
    }

    function computeWasteRescue(shop) {
      const items = [];
      shop.products.forEach((p) => {
        const pName = L(p.nameBn, p.nameEn);
        p.batches.forEach((b) => {
          if (b.currentQty > 0 && b.expiryDays <= 21) {
            const discountPct = b.expiryDays <= 7 ? 15 : 10;
            const rescuePrice = Math.max(b.purchasePrice, Number((b.sellingPrice * (1 - discountPct / 100)).toFixed(2)));
            const cashRecovered = Math.round(b.currentQty * rescuePrice);
            const potentialLoss = Math.round(b.currentQty * b.purchasePrice);
            items.push({
              productName: pName,
              batchNumber: b.batchNumber,
              qty: b.currentQty,
              daysLeft: b.expiryDays,
              discountPct,
              normalPrice: b.sellingPrice,
              rescuePrice,
              cashRecovered,
              potentialLoss,
              headline: L(
                `${b.currentQty}টি ${p.nameBn} ${b.expiryDays} দিনে নষ্ট হবে — ${discountPct}% ছাড় দিন, ৳${cashRecovered} ক্যাশ ফেরত আসবে!`,
                `${b.currentQty} units of ${p.nameEn} expire in ${b.expiryDays} days — Offer ${discountPct}% off to recover ৳${cashRecovered} cash!`
              ),
              offerPost: L(
                `🔥 বিশেষ ছাড়! আজ আমাদের দোকানে তাজা ${p.nameBn}-এ পাচ্ছেন ${discountPct}% ডিসকাউন্ট! আগের দাম ৳${b.sellingPrice}, অফার দাম মাত্র ৳${rescuePrice}। মাত্র ${b.currentQty}টি বাকি, দ্রুত চলে আসুন!`,
                `🔥 Flash Offer! Get ${discountPct}% off fresh ${p.nameEn} today at our store! Regular price ৳${b.sellingPrice}, now only ৳${rescuePrice}. Only ${b.currentQty} units left — visit us today!`
              )
            });
          }
        });
      });
      return items;
    }

    function computeRestocks(shop) {
      return shop.products.map((p) => {
        const w = p.weeklySales;
        const avgGrowth = ((w[1] - w[0]) + (w[2] - w[1]) + (w[3] - w[2])) / 3;
        const mult = getFestivalBoost(p.nameEn);
        const forecast7d = Math.max(0, Math.round((w[3] + Math.max(0, avgGrowth)) * mult));
        const D = Number((forecast7d / 7).toFixed(1));
        const Ldays = p.leadTimeDays;
        const SS = p.safetyStock;
        const ROP = Number((D * Ldays + SS).toFixed(1));
        const S = p.batches.reduce((s, b) => s + b.currentQty, 0);
        const Q = Math.max(0, Math.ceil(ROP - S));
        const daysLeft = D > 0 ? Number((S / D).toFixed(1)) : 999;
        return { product: p, S, D, Ldays, SS, ROP, Q, daysLeft, forecast7d, mult };
      });
    }

    function updateWhatIfSimulator() {
      const pricePct = Number(document.getElementById('simPriceRange').value);
      const mktAdd = Number(document.getElementById('simMktRange').value);
      const stockAdd = Number(document.getElementById('simStockRange').value);
      document.getElementById('simPriceVal').textContent = `${pricePct >= 0 ? '+' : ''}${pricePct}%`;
      document.getElementById('simMktVal').textContent = `৳${mktAdd.toLocaleString()}`;
      document.getElementById('simStockVal').textContent = `৳${stockAdd.toLocaleString()}`;

      const shop = getShop();
      const baseRev = shop.sales.reduce((s, x) => s + x.revenue, 0);
      const baseProfit = shop.sales.reduce((s, x) => s + (x.revenue - x.cogs), 0);
      const projRev = Math.round(baseRev * (1 + pricePct / 100) * (1 - pricePct * 0.004) + mktAdd * 3.5);
      const projProfit = Math.round(baseProfit + (projRev - baseRev) * 0.55 - mktAdd + stockAdd * 0.14);
      const delta = projProfit - baseProfit;

      document.getElementById('whatIfOutputBox').innerHTML = `
        <div class="flex justify-between"><span>${L('বর্তমান মাসিক লাভ:', 'Current Monthly Profit:')}</span><strong>৳${baseProfit.toLocaleString()}</strong></div>
        <div class="flex justify-between"><span>${L('সম্ভাব্য নতুন বিক্রি:', 'Projected Monthly Revenue:')}</span><strong>৳${projRev.toLocaleString()}</strong></div>
        <div class="flex justify-between pt-2 border-t border-slate-700 text-sm"><span>${L('সম্ভাব্য নতুন মাসিক লাভ:', 'Projected Monthly Profit:')}</span><strong class="text-emerald-400">৳${projProfit.toLocaleString()} (${delta >= 0 ? '+' : ''}৳${delta.toLocaleString()})</strong></div>
      `;
    }

    function answerAssistantByKey(key) {
      const shop = getShop();
      const revenue = shop.sales.reduce((s, x) => s + x.revenue, 0);
      const cogs = shop.sales.reduce((s, x) => s + x.cogs, 0);
      const expenses = shop.expenses.reduce((s, x) => s + x.amount, 0);
      const losses = shop.adjustments.reduce((s, x) => s + x.financialLoss, 0);
      const net = revenue - cogs - expenses - losses;
      const waste = computeWasteRescue(shop);
      const restocks = computeRestocks(shop).filter((r) => r.Q > 0);

      let answer = '';
      let chartTitle = L('পণ্য ভিত্তিক লাভ (৳)', 'Profit Contribution by Product (৳)');
      let labels = shop.products.map((p) => L(p.nameBn, p.nameEn));
      let values = shop.products.map((p) => p.weeklySales[3] * (p.sellingPrice - p.purchasePrice));

      if (key === 'restock') {
        answer = L(
          `এই সপ্তাহে আপনার নিচের পণ্যগুলো অর্ডার করা দরকার:\n` +
            (restocks.length ? restocks.map((r) => `• ${r.product.nameBn}: ${r.Q}টি অর্ডার করুন (বর্তমান স্টক ${r.S}, সীমা ${r.ROP})`).join('\n') : 'সব পণ্যের পর্যাপ্ত স্টক রয়েছে।'),
          `Recommended restock orders for this week:\n` +
            (restocks.length ? restocks.map((r) => `• ${r.product.nameEn}: Order ${r.Q} units (Current stock ${r.S}, ROP ${r.ROP})`).join('\n') : 'All active products meet reorder points.')
        );
        chartTitle = L('প্রস্তাবিত অর্ডার পরিমাণ', 'Recommended Reorder Qty (Units)');
        labels = restocks.map((r) => L(r.product.nameBn, r.product.nameEn));
        values = restocks.map((r) => r.Q);
      } else if (key === 'waste') {
        answer = L(
          `অপচয় রোধ এআই সতর্কতা:\n` + (waste.length ? waste.map((w) => `• ${w.headline}`).join('\n') : 'কোনো পণ্য মেয়াদোত্তীর্ণের ঝুঁকিতে নেই।'),
          `Waste Rescue AI Alert:\n` + (waste.length ? waste.map((w) => `• ${w.headline}`).join('\n') : 'No batches at immediate expiry risk.')
        );
        chartTitle = L('অপচয় রোধে নগদ রিকভারি (৳)', 'Waste Rescue Cash Recovery (৳)');
        labels = waste.map((w) => w.productName);
        values = waste.map((w) => w.cashRecovered);
      } else if (key === 'baki') {
        const totalB = shop.bakiLedger.reduce((s, b) => s + b.amount, 0);
        answer = L(
          `বাকির খাতা রিপোর্ট (মোট বাকি ৳${totalB.toLocaleString()}):\n` +
            shop.bakiLedger.map((b) => `• ${b.nameBn}: ৳${b.amount.toLocaleString()} (${b.daysOverdue} দিন বকেয়া)`).join('\n'),
          `Credit Ledger Summary (Total Due ৳${totalB.toLocaleString()}):\n` +
            shop.bakiLedger.map((b) => `• ${b.nameEn}: ৳${b.amount.toLocaleString()} (${b.daysOverdue} days overdue)`).join('\n')
        );
        chartTitle = L('কাস্টমারের বকেয়া (৳)', 'Customer Credit Dues (৳)');
        labels = shop.bakiLedger.map((b) => L(b.nameBn, b.nameEn));
        values = shop.bakiLedger.map((b) => b.amount);
      } else {
        answer = L(
          `${shop.nameBn}-এর আর্থিক সারসংক্ষেপ:\n• মোট বিক্রি: ৳${revenue.toLocaleString()}\n• আসল নিট লাভ: ৳${net.toLocaleString()} (খরচ ৳${expenses} ও স্টক ক্ষতি ৳${losses} বাদ দিয়ে)\n• জরুরি অর্ডার প্রয়োজন: ${restocks.length}টি পণ্য\n• অপচয় রোধের সুযোগ: ${waste.length}টি ব্যাচ`,
          `Financial Summary for ${shop.nameEn}:\n• Total Revenue: ৳${revenue.toLocaleString()}\n• Net Profit: ৳${net.toLocaleString()} (after ৳${expenses} expenses & ৳${losses} stock loss)\n• Urgent Restocks Needed: ${restocks.length} products\n• Expiring Batches for Rescue: ${waste.length}`
        );
      }

      lastSpokenAnswer = answer;
      document.getElementById('aiChatAnswerText').textContent = answer;
      document.getElementById('chatChartTitle').textContent = chartTitle;

      const ctx = document.getElementById('assistantChart').getContext('2d');
      if (chatChartInstance) chatChartInstance.destroy();
      chatChartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ label: chartTitle, data: values, backgroundColor: '#4f46e5', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    function detectQuestionKey(text) {
      const q = text.toLowerCase();
      if (q.includes('কিনতে') || q.includes('reorder') || q.includes('স্টক') || q.includes('order')) return 'restock';
      if (q.includes('নষ্ট') || q.includes('ডিম') || q.includes('waste') || q.includes('expir')) return 'waste';
      if (q.includes('বাকি') || q.includes('baki') || q.includes('credit') || q.includes('due')) return 'baki';
      return 'sales';
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('langToggleBtn').addEventListener('click', () => {
        currentLang = currentLang === 'bn' ? 'en' : 'bn';
        applyLanguage();
        renderAll();
        showToast(L('সম্পূর্ণ ওয়েবসাইট বাংলায় পরিবর্তন করা হয়েছে!', 'Switched entire website to English!'));
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        applyTheme();
        showToast(isDarkMode ? L('ডার্ক মোড চালু হয়েছে!', 'Dark Mode enabled!') : L('লাইট মোড চালু হয়েছে!', 'Light Mode enabled!'));
      });

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
      });

      document.getElementById('shopSelector').addEventListener('change', (e) => {
        currentShopKey = e.target.value;
        renderAll();
      });

      document.getElementById('festivalSelector').addEventListener('change', (e) => {
        currentFestival = e.target.value;
        showToast(L('উৎসবভিত্তিক পূর্বাভাস আপডেট করা হয়েছে!', 'Festival demand forecast updated!'));
        renderAll();
      });

      document.getElementById('resetDemoBtn').addEventListener('click', () => {
        stores = createInitialStores();
        currentFestival = 'NONE';
        applyLanguage();
        renderAll();
        showToast(L('৯০ দিনের বাস্তবসম্মত ডেমো লোড করা হয়েছে!', '90-day realistic shop demo dataset loaded!'));
      });

      document.getElementById('storyDemoBtn').addEventListener('click', () => {
        switchTab('waste');
        showToast(L('গল্প: রহিম ভাইয়ের ৫৫টি ডিম ৪ দিনে নষ্ট হবে — অপচয় রোধ এআই দেখুন!', "Story: Rahim's 55 eggs expire in 4 days — see Waste Rescue AI!"));
      });

      document.getElementById('whyMorningBriefBtn').addEventListener('click', () => {
        openWhyModal(
          L('কেন এই ৩টি কাজ আজ সবচেয়ে জরুরি?', 'Why These 3 Actions Are Top Priority Today'),
          L(
            '<p>১) <strong>স্টক অর্ডার:</strong> ডেলিভারি সময়ের আগেই যেসব পণ্য শেষ হয়ে যাবে সেগুলো আগে রাখা হয়েছে।</p><p>২) <strong>অপচয় রোধ:</strong> ৭ দিনের কম মেয়াদ থাকা ব্যাচে ১৫% ছাড় দিলে নগদ টাকা ফেরত আসে।</p><p>৩) <strong>বাকি আদায়:</strong> ১২ দিনের বেশি বকেয়া থাকা ক্রেতাদের অগ্রাধিকার দেওয়া হয়েছে।</p>',
            '<p>1) <strong>Restock Order:</strong> Items projected to stock out before supplier lead time are prioritized.</p><p>2) <strong>Waste Rescue:</strong> Batches expiring within 7 days get safe 15% clearance discounts to recover cash.</p><p>3) <strong>Credit Collection:</strong> Overdue balances past 12 days are ranked first to protect cash flow.</p>'
          )
        );
      });

      document.getElementById('closeWhyModalBtn').addEventListener('click', () => document.getElementById('whyModal').classList.add('hidden'));
      document.getElementById('closeToastBtn').addEventListener('click', () => document.getElementById('toastBanner').classList.add('hidden'));

      document.getElementById('voiceSpeakBtn').addEventListener('click', () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          lastQuestionKey = 'restock';
          document.getElementById('aiChatInput').value = L('কোন জিনিস কিনতে হবে?', 'Which products should I reorder?');
          answerAssistantByKey('restock');
          showToast(L('ডেমো ভয়েস প্রশ্ন চালানো হয়েছে!', 'Demo voice query executed!'));
          return;
        }
        const rec = new SpeechRec();
        rec.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
        rec.onresult = (ev) => {
          const transcript = ev.results[0][0].transcript;
          document.getElementById('aiChatInput').value = transcript;
          lastQuestionKey = detectQuestionKey(transcript);
          answerAssistantByKey(lastQuestionKey);
        };
        rec.onerror = () => {
          lastQuestionKey = 'restock';
          answerAssistantByKey('restock');
        };
        rec.start();
        showToast(L('মাইক্রোফোন চালু হয়েছে — বাংলায় প্রশ্ন বলুন...', 'Microphone active — speak your question...'));
      });

      document.getElementById('readAloudAnswerBtn').addEventListener('click', () => {
        if ('speechSynthesis' in window && lastSpokenAnswer) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(lastSpokenAnswer);
          utter.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
          window.speechSynthesis.speak(utter);
          showToast(L('উত্তরটি পড়ে শোনানো হচ্ছে...', 'Reading answer aloud...'));
        }
      });

      document.getElementById('aiChatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = document.getElementById('aiChatInput').value.trim();
        if (q) {
          lastQuestionKey = detectQuestionKey(q);
          answerAssistantByKey(lastQuestionKey);
        }
      });

      document.getElementById('addBakiForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const shop = getShop();
        const nm = document.getElementById('bakiName').value.trim();
        const nt = document.getElementById('bakiNotes').value.trim();
        shop.bakiLedger.unshift({
          id: 'bk_' + Date.now(),
          nameBn: nm,
          nameEn: nm,
          phone: document.getElementById('bakiPhone').value.trim(),
          amount: Number(document.getElementById('bakiAmount').value),
          daysOverdue: 1,
          notesBn: nt,
          notesEn: nt
        });
        showToast(L('নতুন বাকি সফলভাবে যোগ হয়েছে!', 'New credit entry added!'));
        renderAll();
      });

      document.getElementById('scanChalanBtn').addEventListener('click', () => {
        const shop = getShop();
        const raw = document.getElementById('chalanTextInput').value.trim();
        const lines = raw.split(/\r?\n/).filter((l) => l.trim());
        const parsed = [];
        lines.forEach((line) => {
          const nums = line.match(/\d+(\.\d+)?/g)?.map(Number) || [];
          const name = line.replace(/\d+(\.\d+)?/g, '').replace(/[xX×@৳,:=-]/g, ' ').trim();
          if (name && nums.length >= 2) {
            parsed.push({ nameBn: name, nameEn: name, quantity: nums[0], unitCost: nums[1], sellingPrice: Math.round(nums[1] * 1.18), expiryDays: 30 });
          }
        });
        if (parsed.length > 0) shop.pendingChalanItems = parsed;
        showToast(L(`চালান থেকে ${shop.pendingChalanItems.length}টি পণ্য পড়া হয়েছে!`, `Extracted ${shop.pendingChalanItems.length} items from invoice!`));
        renderAll();
      });

      document.getElementById('commitChalanStockBtn').addEventListener('click', () => {
        const shop = getShop();
        if (shop.pendingChalanItems.length === 0) return;
        shop.pendingChalanItems.forEach((item) => {
          let prod = shop.products.find((p) => p.nameBn.includes(item.nameBn.slice(0, 5)) || p.nameEn.toLowerCase().includes(item.nameEn.toLowerCase().slice(0, 5)));
          if (!prod) {
            prod = {
              id: 'p_' + Date.now() + Math.random(),
              nameBn: item.nameBn,
              nameEn: item.nameEn,
              purchasePrice: item.unitCost,
              sellingPrice: item.sellingPrice,
              safetyStock: 10,
              leadTimeDays: 3,
              supplierBn: 'চালান সাপ্লায়ার',
              supplierEn: 'Invoice Supplier',
              weeklySales: [5, 8, 10, 12],
              batches: []
            };
            shop.products.push(prod);
          }
          prod.batches.push({
            id: 'b_' + Date.now() + Math.random(),
            batchNumber: 'INV-' + Math.floor(100 + Math.random() * 900),
            purchasePrice: item.unitCost,
            sellingPrice: item.sellingPrice,
            currentQty: item.quantity,
            expiryDays: item.expiryDays
          });
        });
        const count = shop.pendingChalanItems.length;
        shop.pendingChalanItems = [];
        showToast(L(`চালানের ${count}টি পণ্য স্টকে যোগ হয়েছে!`, `Added ${count} invoice items to batch inventory!`));
        renderAll();
      });

      document.getElementById('posSaleForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const shop = getShop();
        const prodId = document.getElementById('posProductSelect').value;
        const qty = Number(document.getElementById('posQty').value);
        const prod = shop.products.find((p) => p.id === prodId);
        if (!prod) return;
        const avail = prod.batches.reduce((s, b) => s + b.currentQty, 0);
        if (avail < qty) {
          showToast(L(`স্টক পর্যাপ্ত নয়! মজুদ আছে ${avail}টি।`, `Insufficient stock! Only ${avail} units available.`));
          return;
        }
        let rem = qty;
        let cogs = 0;
        prod.batches.sort((a, b) => a.expiryDays - b.expiryDays).forEach((b) => {
          if (rem <= 0 || b.currentQty <= 0) return;
          const take = Math.min(b.currentQty, rem);
          b.currentQty -= take;
          rem -= take;
          cogs += take * b.purchasePrice;
        });
        const rev = qty * prod.sellingPrice;
        shop.sales.push({ id: 'INV-' + Date.now(), productId: prod.id, qty, revenue: rev, cogs });
        showToast(L(`${qty}টি ${prod.nameBn} বিক্রি সম্পন্ন!`, `Sold ${qty} units of ${prod.nameEn} via FEFO!`));
        renderAll();
      });

      ['simPriceRange', 'simMktRange', 'simStockRange'].forEach((id) => {
        document.getElementById(id).addEventListener('input', updateWhatIfSimulator);
      });

      applyLanguage();
      renderAll();
    });
  </script>
</body>
</html>
