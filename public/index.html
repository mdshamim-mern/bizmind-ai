<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BizMind AI" />
  <title>BizMind AI</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .nav-btn.active {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .bottom-nav-btn.active {
      color: #4f46e5;
    }
    .bottom-nav-btn.active .bnav-pill {
      background-color: #eef2ff;
    }
    /* Dark Mode Theme */
    html.dark body { background-color: #090e1a; color: #e2e8f0; }
    html.dark header { background-color: rgba(15, 23, 42, 0.92); border-color: #1e293b; }
    html.dark .mobile-bottom-nav { background-color: rgba(15, 23, 42, 0.96) !important; border-color: #1e293b !important; }
    html.dark .bottom-nav-btn { color: #94a3b8; }
    html.dark .bottom-nav-btn.active { color: #818cf8; }
    html.dark .bottom-nav-btn.active .bnav-pill { background-color: rgba(79, 70, 229, 0.22); }
    html.dark .surface-card { background-color: #111827 !important; border-color: #1f2937 !important; color: #f1f5f9 !important; }
    html.dark .surface-sub { background-color: #1e293b !important; border-color: #334155 !important; color: #e2e8f0 !important; }
    html.dark .text-slate-900 { color: #f8fafc !important; }
    html.dark .text-slate-800 { color: #e2e8f0 !important; }
    html.dark .text-slate-700 { color: #cbd5e1 !important; }
    html.dark .text-slate-600 { color: #94a3b8 !important; }
    html.dark .text-slate-500 { color: #94a3b8 !important; }
    html.dark .bg-slate-50 { background-color: #1e293b !important; }
    html.dark .bg-slate-100 { background-color: #1e293b !important; }
    html.dark .bg-white { background-color: #111827 !important; }
    html.dark .border-slate-200 { border-color: #334155 !important; }
    html.dark .border-slate-300 { border-color: #475569 !important; }
    html.dark input, html.dark select, html.dark textarea {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }
    html.dark tr:hover { background-color: #1e293b !important; }
    .safe-pb { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col overflow-x-hidden">
  <!-- Glassmorphic Sticky Top Header (Clean Single-Row on Mobile, Full Toolbar on Tablet/Laptop) -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-2.5 sm:py-3 flex items-center justify-between gap-2">
      <!-- Brand Identity -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl bg-gradient-to-br from-indigo-600 via-blue-600 to-emerald-500 text-white flex items-center justify-center font-extrabold text-sm sm:text-base shadow-md">
          BM
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-sm sm:text-lg text-slate-900 truncate" data-i18n="appName">বিজমাইন্ড এআই</h1>
            <span id="brandTagBadge" data-i18n="brandTag" class="hidden sm:inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 truncate">
              মুদি দোকানের এআই পার্টনার
            </span>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-500 truncate" id="activeShopSubtitle" data-i18n="subtitle">
            অপচয় কমায় · বাকি আদায় করে · লাভ বাড়ায়
          </p>
        </div>
      </div>

      <!-- Compact Action Controls (Always visible & touch-friendly) -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button type="button" id="langToggleBtn" class="min-h-[36px] px-2.5 py-1.5 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 text-xs font-bold transition">
          🌐 EN
        </button>
        <button type="button" id="themeToggleBtn" class="min-h-[36px] px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-800 hover:bg-slate-200 text-xs font-bold transition">
          🌙
        </button>
        <!-- Mobile Filter Toggle Button -->
        <button type="button" id="mobileFilterToggleBtn" class="lg:hidden min-h-[36px] px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-800 text-xs font-bold flex items-center gap-1">
          ⚙️ <span class="hidden sm:inline" data-i18n="btnFilters"></span>
        </button>

        <!-- Laptop/Desktop Inline Controls -->
        <div class="hidden lg:flex items-center gap-2">
          <select id="shopSelector" class="text-xs font-medium bg-slate-100 border border-slate-300 rounded-xl px-2.5 py-2 text-slate-800"></select>
          <select id="festivalSelector" class="text-xs font-semibold bg-amber-50 border border-amber-300 rounded-xl px-2.5 py-2 text-amber-900"></select>
          <button type="button" id="resetDemoBtn" data-i18n="resetDemo" class="text-xs font-semibold px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm"></button>
        </div>
      </div>
    </div>

    <!-- Collapsible Mobile/Tablet Control Drawer (Shop, Festival, 90-Day Demo) -->
    <div id="mobileFilterDrawer" class="hidden lg:hidden border-t border-slate-200 px-3 py-3 bg-slate-50/90 space-y-2.5">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <select id="mobileShopSelector" class="w-full min-h-[42px] text-xs font-medium bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-800"></select>
        <select id="mobileFestivalSelector" class="w-full min-h-[42px] text-xs font-semibold bg-amber-50 border border-amber-300 rounded-xl px-3 py-2 text-amber-900"></select>
        <button type="button" id="mobileResetDemoBtn" data-i18n="resetDemo" class="w-full min-h-[42px] text-xs font-bold px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm"></button>
      </div>
    </div>

    <!-- Tablet & Laptop Top Navigation Bar (Hidden on Mobile Phones in favor of Native Bottom Bar) -->
    <div class="hidden md:block bg-slate-900 text-slate-300 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-4 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="navTabsContainer">
        <button type="button" data-tab="dashboard" id="navTab_dashboard" data-i18n="tab_dashboard" class="nav-btn active whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold transition"></button>
        <button type="button" data-tab="assistant" id="navTab_assistant" data-i18n="tab_assistant" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="waste" id="navTab_waste" data-i18n="tab_waste" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="baki" id="navTab_baki" data-i18n="tab_baki" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="chalan" id="navTab_chalan" data-i18n="tab_chalan" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="forecast" id="navTab_forecast" data-i18n="tab_forecast" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="restock" id="navTab_restock" data-i18n="tab_restock" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="pos" id="navTab_pos" data-i18n="tab_pos" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
        <button type="button" data-tab="simulator" id="navTab_simulator" data-i18n="tab_simulator" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 transition"></button>
      </div>
    </div>
  </header>

  <!-- Toast Banner (Positioned cleanly above Mobile Bottom Nav) -->
  <div id="toastBanner" class="hidden fixed bottom-20 md:bottom-6 left-3 right-3 sm:left-auto sm:right-5 z-50 sm:max-w-md bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center justify-between gap-3">
    <span id="toastMessage" class="text-xs font-medium"></span>
    <button type="button" id="closeToastBtn" class="text-slate-400 hover:text-white text-xs font-bold p-1">✕</button>
  </div>

  <!-- Explainable AI Modal -->
  <div id="whyModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="surface-card bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 space-y-3">
      <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto sm:hidden mb-1"></div>
      <div class="flex items-center justify-between border-b border-slate-200 pb-2.5">
        <h3 class="font-bold text-sm text-indigo-700" id="whyModalTitle"></h3>
        <button type="button" id="closeWhyModalBtn" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-xs">✕</button>
      </div>
      <div id="whyModalBody" class="text-xs sm:text-sm text-slate-700 space-y-2 leading-relaxed"></div>
    </div>
  </div>

  <!-- Mobile "More Tools" Bottom Sheet Drawer -->
  <div id="mobileMoreSheet" class="hidden md:hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end">
    <div class="surface-card bg-white w-full rounded-t-3xl p-5 pb-8 shadow-2xl border-t border-slate-200 space-y-4">
      <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto"></div>
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-sm text-slate-900" data-i18n="moreSheetTitle"></h3>
        <button type="button" id="closeMoreSheetBtn" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-xs">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" data-sheet-tab="chalan" class="sheet-tab-btn surface-sub min-h-[54px] p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left flex items-center gap-2.5">
          <span class="text-lg">📷</span>
          <span class="text-xs font-bold text-slate-800" data-i18n="mTab_chalan"></span>
        </button>
        <button type="button" data-sheet-tab="forecast" class="sheet-tab-btn surface-sub min-h-[54px] p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left flex items-center gap-2.5">
          <span class="text-lg">📈</span>
          <span class="text-xs font-bold text-slate-800" data-i18n="mTab_forecast"></span>
        </button>
        <button type="button" data-sheet-tab="restock" class="sheet-tab-btn surface-sub min-h-[54px] p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left flex items-center gap-2.5">
          <span class="text-lg">📦</span>
          <span class="text-xs font-bold text-slate-800" data-i18n="mTab_restock"></span>
        </button>
        <button type="button" data-sheet-tab="pos" class="sheet-tab-btn surface-sub min-h-[54px] p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left flex items-center gap-2.5">
          <span class="text-lg">🧾</span>
          <span class="text-xs font-bold text-slate-800" data-i18n="mTab_pos"></span>
        </button>
        <button type="button" data-sheet-tab="simulator" class="sheet-tab-btn surface-sub col-span-2 min-h-[52px] p-3 rounded-2xl bg-indigo-50 border border-indigo-200 text-left flex items-center gap-2.5">
          <span class="text-lg">⚡</span>
          <span class="text-xs font-bold text-indigo-800" data-i18n="mTab_simulator"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Workspace (Extra bottom padding on mobile for Bottom Navigation Bar) -->
  <main class="max-w-7xl w-full mx-auto px-3 sm:px-5 py-4 sm:py-6 pb-24 md:pb-8 flex-1 space-y-5 sm:space-y-6">
    <!-- TAB 1: COMMAND CENTER -->
    <section id="tab-dashboard" class="tab-panel space-y-4 sm:space-y-6">
      <div class="bg-gradient-to-br from-emerald-900 via-teal-900 to-indigo-950 text-white rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-lg space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="space-y-1">
            <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-300" id="impactSubBadge" data-i18n="impactSub"></span>
            <h2 class="text-base sm:text-xl font-extrabold leading-snug" id="impactHeadlineText"></h2>
          </div>
          <button type="button" id="storyDemoBtn" data-i18n="storyBtn" class="w-full sm:w-auto min-h-[44px] px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs shadow transition text-center"></button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3">
          <div class="bg-white/10 border border-white/15 rounded-2xl p-3.5 flex sm:block items-center justify-between">
            <p class="text-xs text-emerald-200" id="lblImpactWaste" data-i18n="lblImpactWaste"></p>
            <p class="text-xl sm:text-2xl font-extrabold sm:mt-0.5" id="impactWasteSaved"></p>
          </div>
          <div class="bg-white/10 border border-white/15 rounded-2xl p-3.5 flex sm:block items-center justify-between">
            <p class="text-xs text-sky-200" id="lblImpactStockout" data-i18n="lblImpactStockout"></p>
            <p class="text-xl sm:text-2xl font-extrabold sm:mt-0.5" id="impactStockouts"></p>
          </div>
          <div class="bg-white/10 border border-white/15 rounded-2xl p-3.5 flex sm:block items-center justify-between">
            <p class="text-xs text-amber-200" id="lblImpactBaki" data-i18n="lblImpactBaki"></p>
            <p class="text-xl sm:text-2xl font-extrabold sm:mt-0.5" id="impactBaki"></p>
          </div>
        </div>
      </div>

      <!-- KPI Grid (2x2 crisp cards on Mobile, 4x1 on Laptop) -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <div class="surface-card bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium" id="lblKpiRev" data-i18n="lblKpiRev"></p>
          <p class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-1" id="kpiRevenue"></p>
        </div>
        <div class="surface-card bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium" id="lblKpiGross" data-i18n="lblKpiGross"></p>
          <p class="text-xl sm:text-2xl font-extrabold text-indigo-600 mt-1" id="kpiGrossProfit"></p>
        </div>
        <div class="surface-card bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium" id="lblKpiLoss" data-i18n="lblKpiLoss"></p>
          <p class="text-xl sm:text-2xl font-extrabold text-rose-600 mt-1" id="kpiInvLoss"></p>
        </div>
        <div class="surface-card bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium" id="lblKpiNet" data-i18n="lblKpiNet"></p>
          <p class="text-xl sm:text-2xl font-extrabold text-emerald-600 mt-1" id="kpiNetProfit"></p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <div class="lg:col-span-2 surface-card bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600" data-i18n="morningSub"></span>
              <h3 class="text-sm sm:text-base font-bold text-slate-900" id="lblMorningTitle" data-i18n="lblMorningTitle"></h3>
            </div>
            <button type="button" id="whyMorningBriefBtn" data-i18n="whyBtn" class="min-h-[34px] text-xs font-bold px-3 py-1 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100"></button>
          </div>
          <div id="morningBriefList" class="space-y-2.5"></div>
        </div>

        <div class="surface-card bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-600" data-i18n="healthSub"></span>
              <h3 class="text-sm sm:text-base font-bold text-slate-900" id="lblHealthTitle" data-i18n="lblHealthTitle"></h3>
            </div>
            <div class="text-right">
              <span class="text-2xl sm:text-3xl font-extrabold text-indigo-600" id="healthScoreValue"></span>
              <span class="text-xs font-bold text-slate-400" data-i18n="outOf100"></span>
            </div>
          </div>
          <div id="healthBreakdownList" class="space-y-2.5 text-xs"></div>
        </div>
      </div>

      <div class="surface-card bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2" id="marginLeakBox">
        <div class="flex items-center justify-between gap-2">
          <h4 class="text-xs font-bold text-rose-700 uppercase tracking-wider" data-i18n="marginLeakHeading"></h4>
          <span class="text-[11px] font-semibold text-rose-600" id="lblMarginBadge" data-i18n="lblMarginBadge"></span>
        </div>
        <div id="marginLeakAlerts" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- TAB 2: VOICE ASSISTANT & AI CHAT -->
    <section id="tab-assistant" class="tab-panel hidden space-y-4 sm:space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <div class="lg:col-span-2 surface-card bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-3.5">
          <!-- Header & Live Mode Controls -->
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-slate-900" id="lblVoiceTitle" data-i18n="voiceTitle"></h3>
                <span id="aiEngineStatusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800"></span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5" id="lblVoiceSub" data-i18n="voiceSub"></p>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" id="autoSpeakToggleBtn" class="min-h-[34px] px-2.5 py-1 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 text-xs font-bold"></button>
              <button type="button" id="clearChatBtn" data-i18n="btnClearChat" class="min-h-[34px] px-2.5 py-1 rounded-xl border border-slate-300 bg-slate-100 text-slate-700 text-xs font-bold"></button>
            </div>
          </div>

          <!-- Conversation Chat Thread (Real Multi-Turn Bubbles) -->
          <div class="flex flex-wrap items-center justify-between gap-2 px-3 py-2 rounded-xl bg-indigo-50/80 border border-indigo-200 text-[11px] font-semibold text-indigo-900">
            <span id="multiAgentTraceBanner">🤖 5-Agent Pipeline: Inventory · Sales · Finance · Supplier · Manager + RAG</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold">AI Accuracy: 94% (MAPE + Z-Score)</span>
          </div>
          <div id="chatMessagesContainer" class="surface-sub bg-slate-50 border border-slate-200 rounded-2xl p-3 sm:p-4 h-80 sm:h-96 overflow-y-auto space-y-3"></div>

          <!-- Live Listening Status Banner -->
          <div id="voiceListeningBar" class="hidden items-center justify-between gap-2 px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-rose-600 animate-ping"></span><span id="liveTranscriptPreview"></span></span>
            <button type="button" id="stopVoiceBtn" data-i18n="btnStopVoice" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold"></button>
          </div>

          <!-- Quick Starter Chips -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar" id="quickAskContainer"></div>

          <!-- Voice + Text Input Composer -->
          <form id="aiChatForm" class="flex items-center gap-2">

    function showToast(msg) {

    function copyText(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(L(`${label} কপি করা হয়েছে!`, `${label} copied to clipboard!`));
    }

      if (isDarkMode) {

      } else {
        htmlEl.classList.remove('dark');
        btn.textContent = dict[currentLang].darkBtn;
      }
    }

    function getFestivalBoost(prodEn) {
      const lower = prodEn.toLowerCase();
      if (currentFestival === 'RAMADAN_EID' && (lower.includes('oil') || lower.includes('rice') || lower.includes('egg') || lower.includes('milk'))) return 1.4;
      if (currentFestival === 'POHELA_BOISHAKH' && (lower.includes('rice') || lower.includes('oil') || lower.includes('milk'))) return 1.25;
      if (currentFestival === 'MONSOON_RAIN' && (lower.includes('rice') || lower.includes('egg'))) return 1.2;
      return 1.0;
    }

    function computeWasteRescue(shop) {
      const items = [];
      shop.products.forEach((p) => {
        const pName = L(p.nameBn, p.nameEn);
        p.batches.forEach((b) => {
          if (b.currentQty > 0 && b.expiryDays <= 21) {
            const discountPct = b.expiryDays <= 7 ? 15 : 10;
            const rescuePrice = Math.max(b.purchasePrice, Number((b.sellingPrice * (1 - discountPct / 100)).toFixed(2)));
            const cashRecovered = Math.round(b.currentQty * rescuePrice);
            const potentialLoss = Math.round(b.currentQty * b.purchasePrice);
            items.push({
              productName: pName,
              batchNumber: b.batchNumber,
              qty: b.currentQty,
              daysLeft: b.expiryDays,
              discountPct,
              normalPrice: b.sellingPrice,
              rescuePrice,
              cashRecovered,
              potentialLoss,
              headline: L(
                `${b.currentQty}টি ${p.nameBn} ${b.expiryDays} দিনে নষ্ট হবে — ${discountPct}% ছাড় দিন, ৳${cashRecovered} ক্যাশ ফেরত আসবে!`,
                `${b.currentQty} units of ${p.nameEn} expire in ${b.expiryDays} days — Offer ${discountPct}% off to recover ৳${cashRecovered} cash!`
              ),
              offerPost: L(
                `🔥 বিশেষ ছাড়! আজ আমাদের দোকানে তাজা ${p.nameBn}-এ পাচ্ছেন ${discountPct}% ডিসকাউন্ট! আগের দাম ৳${b.sellingPrice}, অফার দাম মাত্র ৳${rescuePrice}। মাত্র ${b.currentQty}টি বাকি, দ্রুত চলে আসুন!`,
                `🔥 Flash Offer! Get ${discountPct}% off fresh ${p.nameEn} today at our store! Regular price ৳${b.sellingPrice}, now only ৳${rescuePrice}. Only ${b.currentQty} units left — visit us today!`
              )
            });
          }
        });
      });
      return items;
    }

    function computeRestocks(shop) {
      return shop.products.map((p) => {
        const w = p.weeklySales;
        const avgGrowth = ((w[1] - w[0]) + (w[2] - w[1]) + (w[3] - w[2])) / 3;
        const mult = getFestivalBoost(p.nameEn);
        const forecast7d = Math.max(0, Math.round((w[3] + Math.max(0, avgGrowth)) * mult));
        const D = Number((forecast7d / 7).toFixed(1));
        const Ldays = p.leadTimeDays;
        const SS = p.safetyStock;
        const ROP = Number((D * Ldays + SS).toFixed(1));
        const S = p.batches.reduce((s, b) => s + b.currentQty, 0);
        const Q = Math.max(0, Math.ceil(ROP - S));
        const daysLeft = D > 0 ? Number((S / D).toFixed(1)) : 999;
        return { product: p, S, D, Ldays, SS, ROP, Q, daysLeft, forecast7d, mult };
      });
    }

    function updateWhatIfSimulator() {
      const pricePct = Number(document.getElementById('simPriceRange').value);
      const mktAdd = Number(document.getElementById('simMktRange').value);
      const stockAdd = Number(document.getElementById('simStockRange').value);
      document.getElementById('simPriceVal').textContent = `${pricePct >= 0 ? '+' : ''}${pricePct}%`;
      document.getElementById('simMktVal').textContent = `৳${mktAdd.toLocaleString()}`;
      document.getElementById('simStockVal').textContent = `৳${stockAdd.toLocaleString()}`;

      const shop = getShop();
      const baseRev = shop.sales.reduce((s, x) => s + x.revenue, 0);
      const baseProfit = shop.sales.reduce((s, x) => s + (x.revenue - x.cogs), 0);
      const projRev = Math.round(baseRev * (1 + pricePct / 100) * (1 - pricePct * 0.004) + mktAdd * 3.5);
      const projProfit = Math.round(baseProfit + (projRev - baseRev) * 0.55 - mktAdd + stockAdd * 0.14);
      const delta = projProfit - baseProfit;

      document.getElementById('whatIfOutputBox').innerHTML = `
        <div class="flex justify-between"><span>${L('বর্তমান মাসিক লাভ:', 'Current Monthly Profit:')}</span><strong>৳${baseProfit.toLocaleString()}</strong></div>
        <div class="flex justify-between"><span>${L('সম্ভাব্য নতুন বিক্রি:', 'Projected Monthly Revenue:')}</span><strong>৳${projRev.toLocaleString()}</strong></div>
        <div class="flex justify-between pt-2 border-t border-slate-700 text-sm"><span>${L('সম্ভাব্য নতুন মাসিক লাভ:', 'Projected Monthly Profit:')}</span><strong class="text-emerald-400">৳${projProfit.toLocaleString()} (${delta >= 0 ? '+' : ''}৳${delta.toLocaleString()})</strong></div>
      `;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*#_•]/g, ' ').trim();
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      } catch (_e) {}
    }

    async function handleUserChatMessage(rawText) {
      const userText = rawText.trim();
      if (!userText) return;

      chatHistory.push({ role: 'user', text: userText });
      renderChatMessages();

      const localResult = buildSmartLocalResponse(userText);

      // Live Vercel Backend + Gemini 2.5 Flash + Google Search Grounding (Works from GitHub Pages & Mobile!)
      const shop = getShop();
      const revenue = shop.sales.reduce((s, x) => s + x.revenue, 0);
      const cogs = shop.sales.reduce((s, x) => s + x.cogs, 0);
      const expenses = shop.expenses.reduce((s, x) => s + x.amount, 0);
      const losses = shop.adjustments.reduce((s, x) => s + x.financialLoss, 0);
      const net = revenue - cogs - expenses - losses;
      const waste = computeWasteRescue(shop);
      const restocks = computeRestocks(shop).filter((r) => r.Q > 0);

      chatHistory.push({ role: 'ai', text: L('🔍 লাইভ এআই উত্তর খুঁজছি...', '🔍 Thinking & searching live...') });
      renderChatMessages();

      const shopContext = {
        shopName: L(shop.nameBn, shop.nameEn),
        revenue,
        netProfit: net,
        expenses,
        losses,
        products: shop.products.map((p) => ({
          name: L(p.nameBn, p.nameEn),
          stock: p.batches.reduce((s, b) => s + b.currentQty, 0),
          cost: p.purchasePrice,
          price: p.sellingPrice
        })),
        restocks: restocks.map((r) => ({ name: L(r.product.nameBn, r.product.nameEn), orderQty: r.Q })),
        expiring: waste.map((w) => w.headline),
        baki: shop.bakiLedger.map((b) => ({ name: L(b.nameBn, b.nameEn), amount: b.amount, daysOverdue: b.daysOverdue }))
      };

      const historyPayload = chatHistory.slice(-7, -1).map((m) => ({
        role: m.role === 'user' ? 'user' : 'model',
        text: m.text
      }));

      try {
        // Try SSE Word-by-Word Streaming first, then fallback to JSON /chat
        const streamResp = await fetch('https://bizmind-ai-orcin.vercel.app/api/v1/public-ai/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userText, lang: currentLang, history: historyPayload, shopContext })
        });
        if (streamResp.ok && streamResp.body) {
          const reader = streamResp.body.getReader();
          const decoder = new TextDecoder();
          let streamedText = '';
          let buffer = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop() || '';
            for (const part of parts) {
              if (!part.startsWith('data: ')) continue;
              try {
                const evt = JSON.parse(part.slice(6));
                if (evt.type === 'meta' && Array.isArray(evt.agents)) {
                  const banner = document.getElementById('multiAgentTraceBanner');
                  if (banner) {
                    banner.textContent = '🤖 ' + evt.agents.map((a) => a.agent).join(' → ') + ' (' + (evt.latencyMs || 0) + 'ms)';
                  }
                } else if (evt.type === 'token') {
                  streamedText += evt.text;
                  chatHistory[chatHistory.length - 1] = { role: 'ai', text: streamedText };
                  renderChatMessages();
                }
              } catch (_e) {}
            }
          }
          if (streamedText.trim()) {
            lastSpokenAnswer = streamedText.trim();
            updateAssistantChart(localResult.chartTitle, localResult.labels, localResult.values);
            if (autoSpeakEnabled) speakText(lastSpokenAnswer);
            return;
          }
        }
        const resp = await fetch('https://bizmind-ai-orcin.vercel.app/api/v1/public-ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userText,
            lang: currentLang,
            history: historyPayload,
            shopContext
          })
        });
        if (resp.ok) {
          const json = await resp.json();
          if (json && json.answer) {
            chatHistory[chatHistory.length - 1] = { role: 'ai', text: json.answer };
            lastSpokenAnswer = json.answer;
            renderChatMessages();
            updateAssistantChart(localResult.chartTitle, localResult.labels, localResult.values);
            if (autoSpeakEnabled) speakText(lastSpokenAnswer);
            return;
          }
        }
        chatHistory.pop();
      } catch (_err) {
        chatHistory.pop();
      }

      chatHistory.push({ role: 'ai', text: localResult.reply });
      lastSpokenAnswer = localResult.reply;
      renderChatMessages();
      updateAssistantChart(localResult.chartTitle, localResult.labels, localResult.values);
      if (autoSpeakEnabled) speakText(lastSpokenAnswer);
    }

    function answerAssistantByKey(key) {
      const map = {
        sales: L('আজ কত বিক্রি হলো এবং নিট লাভ কত?', "What are today's sales and net profit?"),
        restock: L('কোন জিনিসগুলো অর্ডার করতে হবে?', 'Which products should I reorder?'),
        waste: L('কোন পণ্যগুলো তাড়াতাড়ি নষ্ট হবে?', 'Which items are expiring soon?'),
        baki: L('কার বাকি আদায় আগে করা দরকার?', 'Whose credit due is top priority?')
      };
      if (chatHistory.length === 0) {
        const shop = getShop();
        updateAssistantChart(
          L('পণ্য ভিত্তিক লাভ (৳)', 'Profit Contribution by Product (৳)'),
          shop.products.map((p) => L(p.nameBn, p.nameEn)),
          shop.products.map((p) => p.weeklySales[3] * (p.sellingPrice - p.purchasePrice))
        );
        renderChatMessages();
        return;
      }
      if (map[key]) handleUserChatMessage(map[key]);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
      document.querySelectorAll('.bottom-nav-btn[data-btab]').forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-btab') === tab);
      });
      const moreBtn = document.getElementById('openMoreSheetBtn');
      const secondaryTabs = ['chalan', 'forecast', 'restock', 'pos', 'simulator'];
      moreBtn.classList.toggle('active', secondaryTabs.includes(tab));

      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('mobileMoreSheet').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Language Toggle
      document.getElementById('langToggleBtn').addEventListener('click', () => {
        currentLang = currentLang === 'bn' ? 'en' : 'bn';
        applyLanguage();
        renderAll();
        showToast(L('সম্পূর্ণ ওয়েবসাইট বাংলায় পরিবর্তন করা হয়েছে!', 'Switched entire website to English!'));
      });

      // Light / Dark Mode Toggle
      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        applyTheme();
        showToast(isDarkMode ? L('ডার্ক মোড চালু হয়েছে!', 'Dark Mode enabled!') : L('লাইট মোড চালু হয়েছে!', 'Light Mode enabled!'));
      });

      // Mobile Filter Drawer Toggle
      document.getElementById('mobileFilterToggleBtn').addEventListener('click', () => {
        document.getElementById('mobileFilterDrawer').classList.toggle('hidden');
      });

      // Mobile More Sheet Controls
      document.getElementById('openMoreSheetBtn').addEventListener('click', () => {
        document.getElementById('mobileMoreSheet').classList.remove('hidden');
      });
      document.getElementById('closeMoreSheetBtn').addEventListener('click', () => {
        document.getElementById('mobileMoreSheet').classList.add('hidden');
      });
      document.querySelectorAll('.sheet-tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-sheet-tab')));
      });

      // Top & Bottom Nav Tabs
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
      });
      document.querySelectorAll('.bottom-nav-btn[data-btab]').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-btab')));
      });

      // Synced Shop & Festival Selectors (Desktop + Mobile)
      function handleShopChange(val) {
        currentShopKey = val;
        populateSelectors();
        renderAll();
      }
      function handleFestivalChange(val) {
        currentFestival = val;
        populateSelectors();
        showToast(L('উৎসবভিত্তিক পূর্বাভাস আপডেট করা হয়েছে!', 'Festival demand forecast updated!'));
        renderAll();
      }
      function handleDemoReset() {
        stores = createInitialStores();
        currentFestival = 'NONE';
        applyLanguage();
        renderAll();
        document.getElementById('mobileFilterDrawer').classList.add('hidden');
        showToast(L('৯০ দিনের বাস্তবসম্মত ডেমো লোড করা হয়েছে!', '90-day realistic shop demo dataset loaded!'));
      }

      document.getElementById('shopSelector').addEventListener('change', (e) => handleShopChange(e.target.value));
      document.getElementById('mobileShopSelector').addEventListener('change', (e) => handleShopChange(e.target.value));
      document.getElementById('festivalSelector').addEventListener('change', (e) => handleFestivalChange(e.target.value));
      document.getElementById('mobileFestivalSelector').addEventListener('change', (e) => handleFestivalChange(e.target.value));
      document.getElementById('resetDemoBtn').addEventListener('click', handleDemoReset);
      document.getElementById('mobileResetDemoBtn').addEventListener('click', handleDemoReset);

      document.getElementById('storyDemoBtn').addEventListener('click', () => {
        switchTab('waste');
        showToast(L('গল্প: রহিম ভাইয়ের ৫৫টি ডিম ৪ দিনে নষ্ট হবে — অপচয় রোধ এআই দেখুন!', "Story: Rahim's 55 eggs expire in 4 days — see Waste Rescue AI!"));
      });

      document.getElementById('whyMorningBriefBtn').addEventListener('click', () => {
        openWhyModal(
          L('কেন এই ৩টি কাজ আজ সবচেয়ে জরুরি?', 'Why These 3 Actions Are Top Priority Today'),
          L(
            '<p>১) <strong>স্টক অর্ডার:</strong> ডেলিভারি সময়ের আগেই যেসব পণ্য শেষ হয়ে যাবে সেগুলো আগে রাখা হয়েছে।</p><p>২) <strong>অপচয় রোধ:</strong> ৭ দিনের কম মেয়াদ থাকা ব্যাচে ১৫% ছাড় দিলে নগদ টাকা ফেরত আসে।</p><p>৩) <strong>বাকি আদায়:</strong> ১২ দিনের বেশি বকেয়া থাকা ক্রেতাদের অগ্রাধিকার দেওয়া হয়েছে।</p>',
            '<p>1) <strong>Restock Order:</strong> Items projected to stock out before supplier lead time are prioritized.</p><p>2) <strong>Waste Rescue:</strong> Batches expiring within 7 days get safe 15% clearance discounts to recover cash.</p><p>3) <strong>Credit Collection:</strong> Overdue balances past 12 days are ranked first to protect cash flow.</p>'
          )
        );
      });

      document.getElementById('closeWhyModalBtn').addEventListener('click', () => document.getElementById('whyModal').classList.add('hidden'));
      document.getElementById('closeToastBtn').addEventListener('click', () => document.getElementById('toastBanner').classList.add('hidden'));

      // Voice AI Controls: Zero-Setup Auto-Speak & Real Interim Speech-to-Text
      updateVoiceHeaderBadges();

      document.getElementById('autoSpeakToggleBtn').addEventListener('click', () => {
        autoSpeakEnabled = !autoSpeakEnabled;
        updateVoiceHeaderBadges();
      });

      document.getElementById('clearChatBtn').addEventListener('click', () => {
        chatHistory = [];
        renderChatMessages();
        showToast(L('চ্যাট ইতিহাস মুছে ফেলা হয়েছে।', 'Chat history cleared.'));
      });

      function stopVoiceRecognition() {
        if (activeRecognition) {
          try { activeRecognition.stop(); } catch (_e) {}
          activeRecognition = null;
        }
        document.getElementById('voiceListeningBar').classList.add('hidden');
        document.getElementById('voiceListeningBar').classList.remove('flex');
      }

      document.getElementById('stopVoiceBtn').addEventListener('click', stopVoiceRecognition);

      document.getElementById('voiceSpeakBtn').addEventListener('click', () => {
        if (activeRecognition) {
          stopVoiceRecognition();
          return;
        }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          showToast(L('এই ব্রাউজারে সরাসরি মাইক্রোফোন সাপোর্ট নেই—অনুগ্রহ করে Chrome ব্যবহার করুন বা নিচে টাইপ করুন।', 'Speech recognition is not supported in this browser—please use Chrome or type your message below.'));
          return;
        }
        const rec = new SpeechRec();
        activeRecognition = rec;
        rec.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
        rec.interimResults = true;
        rec.continuous = false;

        const bar = document.getElementById('voiceListeningBar');
        const preview = document.getElementById('liveTranscriptPreview');
        bar.classList.remove('hidden');
        bar.classList.add('flex');
        preview.textContent = L('শুনছি... আপনি বাংলায় কথা বলুন', 'Listening... speak naturally');

        let finalTranscript = '';
        rec.onresult = (ev) => {
          let interim = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) finalTranscript += t;
            else interim += t;
          }
          const shown = (finalTranscript + interim).trim();
          preview.textContent = shown || L('শুনছি...', 'Listening...');
          document.getElementById('aiChatInput').value = shown;
        };

        rec.onend = () => {
          stopVoiceRecognition();
          const spoken = (finalTranscript || document.getElementById('aiChatInput').value).trim();
          if (spoken) {
            document.getElementById('aiChatInput').value = '';
            handleUserChatMessage(spoken);
          }
        };

        rec.onerror = (ev) => {
          stopVoiceRecognition();
          showToast(L(`মাইক্রোফোন চালু করা যায়নি (${ev.error})। ব্রাউজারে মাইক্রোফোন পারমিশন দিন অথবা টাইপ করুন।`, `Microphone error (${ev.error}). Please allow microphone permission or type below.`));
        };

        try {
          rec.start();
        } catch (_e) {
          stopVoiceRecognition();
        }
      });

      document.getElementById('readAloudAnswerBtn').addEventListener('click', () => {
        if (lastSpokenAnswer) {
          speakText(lastSpokenAnswer);
          showToast(L('উত্তরটি পড়ে শোনানো হচ্ছে...', 'Reading answer aloud...'));
        }
      });

      document.getElementById('aiChatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputEl = document.getElementById('aiChatInput');
        const q = inputEl.value.trim();
        if (q) {
          inputEl.value = '';
          handleUserChatMessage(q);
        }
      });

      document.getElementById('addBakiForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const shop = getShop();
        const nm = document.getElementById('bakiName').value.trim();
        const nt = document.getElementById('bakiNotes').value.trim();
        shop.bakiLedger.unshift({
          id: 'bk_' + Date.now(),
          nameBn: nm,
          nameEn: nm,
          phone: document.getElementById('bakiPhone').value.trim(),
          amount: Number(document.getElementById('bakiAmount').value),
          daysOverdue: 1,
          notesBn: nt,
          notesEn: nt
        });
        showToast(L('নতুন বাকি সফলভাবে যোগ হয়েছে!', 'New credit entry added!'));
        renderAll();
      });

      document.getElementById('scanChalanBtn').addEventListener('click', () => {
        const shop = getShop();
        const raw = document.getElementById('chalanTextInput').value.trim();
        const lines = raw.split(/\r?\n/).filter((l) => l.trim());
        const parsed = [];
        lines.forEach((line) => {
          const nums = line.match(/\d+(\.\d+)?/g)?.map(Number) || [];
          const name = line.replace(/\d+(\.\d+)?/g, '').replace(/[xX×@৳,:=-]/g, ' ').trim();
          if (name && nums.length >= 2) {
            parsed.push({ nameBn: name, nameEn: name, quantity: nums[0], unitCost: nums[1], sellingPrice: Math.round(nums[1] * 1.18), expiryDays: 30 });
          }
        });
        if (parsed.length > 0) shop.pendingChalanItems = parsed;
        showToast(L(`চালান থেকে ${shop.pendingChalanItems.length}টি পণ্য পড়া হয়েছে!`, `Extracted ${shop.pendingChalanItems.length} items from invoice!`));
        renderAll();
      });

      document.getElementById('commitChalanStockBtn').addEventListener('click', () => {
        const shop = getShop();
        if (shop.pendingChalanItems.length === 0) return;
        shop.pendingChalanItems.forEach((item) => {
          let prod = shop.products.find((p) => p.nameBn.includes(item.nameBn.slice(0, 5)) || p.nameEn.toLowerCase().includes(item.nameEn.toLowerCase().slice(0, 5)));
          if (!prod) {
            prod = {
              id: 'p_' + Date.now() + Math.random(),
              nameBn: item.nameBn,
              nameEn: item.nameEn,
              purchasePrice: item.unitCost,
              sellingPrice: item.sellingPrice,
              safetyStock: 10,
              leadTimeDays: 3,
              supplierBn: 'চালান সাপ্লায়ার',
              supplierEn: 'Invoice Supplier',
              weeklySales: [5, 8, 10, 12],
              batches: []
            };
            shop.products.push(prod);
          }
          prod.batches.push({
            id: 'b_' + Date.now() + Math.random(),
            batchNumber: 'INV-' + Math.floor(100 + Math.random() * 900),
            purchasePrice: item.unitCost,
            sellingPrice: item.sellingPrice,
            currentQty: item.quantity,
            expiryDays: item.expiryDays
          });
        });
        const count = shop.pendingChalanItems.length;
        shop.pendingChalanItems = [];
        showToast(L(`চালানের ${count}টি পণ্য স্টকে যোগ হয়েছে!`, `Added ${count} invoice items to batch inventory!`));
        renderAll();
      });

      document.getElementById('posSaleForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const shop = getShop();
        const prodId = document.getElementById('posProductSelect').value;
        const qty = Number(document.getElementById('posQty').value);
        const prod = shop.products.find((p) => p.id === prodId);
        if (!prod) return;
        const avail = prod.batches.reduce((s, b) => s + b.currentQty, 0);
        if (avail < qty) {
          showToast(L(`স্টক পর্যাপ্ত নয়! মজুদ আছে ${avail}টি।`, `Insufficient stock! Only ${avail} units available.`));
          return;
        }
        let rem = qty;
        let cogs = 0;
        prod.batches.sort((a, b) => a.expiryDays - b.expiryDays).forEach((b) => {
          if (rem <= 0 || b.currentQty <= 0) return;
          const take = Math.min(b.currentQty, rem);
          b.currentQty -= take;
          rem -= take;
          cogs += take * b.purchasePrice;
        });
        const rev = qty * prod.sellingPrice;
        shop.sales.push({ id: 'INV-' + Date.now(), productId: prod.id, qty, revenue: rev, cogs });
        showToast(L(`${qty}টি ${prod.nameBn} বিক্রি সম্পন্ন!`, `Sold ${qty} units of ${prod.nameEn} via FEFO!`));
        renderAll();
      });

      ['simPriceRange', 'simMktRange', 'simStockRange'].forEach((id) => {
        document.getElementById(id).addEventListener('input', updateWhatIfSimulator);
      });

      applyLanguage();
      renderAll();
    });
  </script>
</body>
</html>
