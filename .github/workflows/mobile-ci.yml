name: BizMind AI Mobile Responsive CI (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/mobile-responsive.spec.ts
