name: BizMind AI CI, Isolation & Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run AI Grounding, RAG, MAPE & Security Evaluation Tests
        run: npx ts-node tests/ai-evaluation.test.ts

      - name: Run Multi-Tenant Isolation, Idempotency, RBAC, OTP & AI Quota Tests
        run: npx ts-node tests/isolation-and-enterprise.test.ts
